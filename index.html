<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De la baralla a la batalla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600&family=Permanent+Marker&display=swap">
<style>
:root{--bg:#ffffff;--ink:#141414;--soft:#5d5d58;--line:#d9d9d2;--mark:#ffd60a;--on-mark:#141414;--warn:#b42318;
  --display:"Archivo Black","Arial Black",Impact,sans-serif;--body:"Archivo","Helvetica Neue",Arial,sans-serif;--hand:"Permanent Marker","Comic Sans MS",cursive}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--ink:#f1f1ec;--soft:#b3b3ab;--line:#3a3a36;--warn:#ff8a7a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;padding:32px 16px 56px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
.eyebrow{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--soft);margin:0 0 6px}
h1{font-family:var(--display);font-size:clamp(2.3rem,7vw,4.4rem);line-height:.95;margin:0;text-wrap:balance}
h1 span{background:var(--mark);color:var(--on-mark);padding:0 .12em}
.sub{font-family:var(--hand);font-size:clamp(1.3rem,3.5vw,1.9rem);margin:10px 0 0}
.lead{margin:12px 0 0;max-width:62ch;font-size:1.08rem}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav a{font-family:var(--display);text-decoration:none;color:inherit;border:3px solid var(--ink);padding:4px 12px}
nav a:hover,nav a:focus-visible{background:var(--mark);color:var(--on-mark);outline:none}
section{display:flex;flex-direction:column;gap:12px;scroll-margin-top:16px}
h2{font-family:var(--display);font-size:clamp(1.3rem,3.6vw,1.8rem);line-height:1.1;margin:0;display:flex;gap:.5em;align-items:baseline;flex-wrap:wrap}
h2 .n{background:var(--ink);color:var(--bg);padding:0 .3em}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.main{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;border:3px solid var(--ink);padding:14px 18px;color:inherit;text-decoration:none}
a.main:hover,a.main:focus-visible{background:var(--mark);color:var(--on-mark);outline:none}
.t{font-family:var(--display);font-size:1.15rem;line-height:1.15}
.d{font-size:.95rem}
.go{font-family:var(--hand);white-space:nowrap}
.rows{gap:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:7.5em 1fr auto;gap:12px;align-items:baseline;padding:9px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
a.row:hover,a.row:focus-visible{background:var(--mark);color:var(--on-mark);outline:none}
.kind{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--soft)}
a.row:hover .kind{color:inherit}
.rt{font-weight:600}
.rd{color:var(--soft);font-size:.92rem}
a.row:hover .rd{color:inherit}
.flag{color:var(--warn);font-size:.85rem;font-weight:600}
.soon{border-style:dashed;border-color:var(--soft);color:var(--soft)}
.row.soon{border-style:none none solid;border-bottom-color:var(--line)}
.row.soon .rt{font-weight:400}
.note{font-family:var(--hand);font-size:1.15rem;margin:0}
@media (max-width:560px){.row{grid-template-columns:1fr auto}.row .kind{grid-column:1/-1}.main{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Música · 2n ESO · Vinculada a Beat Fighters</p>
    <h1>De la baralla a la <span>batalla</span></h1>
    <p class="sub">Arrels del hip-hop</p>
    <p class="lead">Cinc sessions per entendre d’on ve el hip-hop i per què una batalla no és una baralla. Aquí hi ha tot el material de cada sessió.</p>
  </header>
  <nav id="nav" aria-label="Sessions"></nav>
  <div id="content"></div>
  <p class="note">Una batalla no és una baralla.</p>
</div>
<script>
/* ============ COM ACTUALITZAR AQUEST ÍNDEX ============
   1) Fitxers de Drive (PDF, presentacions, àudios): enganxa l'enllaç
      de compartir entre les cometes de DRIVE. Mentre estigui buit,
      el material surt en gris com a «Pendent d'enllaçar».
   2) Pàgines pròpies del repositori (page:'nom.html'): només cal
      pujar el fitxer. L'índex detecta sol si ja hi és.
   3) Per afegir un material, copia una línia d'items i canvia-la.
   ===================================================== */
const DRIVE = {
  'versembrant-1-1': 'https://drive.google.com/file/d/1J2-uS8L1oED_fpAq2zF9C1onheF_PC0G/view?usp=sharing',   // Versembrant M1 · Tema 1.1 Context social
  'versembrant-3-2': 'https://drive.google.com/file/d/1YFbvlP95qF_YJ35PwPJ1h3K60KA8o1wv/view?usp=sharing',   // Versembrant M1 · Tema 3.2 Precedents vocals
  'versembrant-4-2': 'https://drive.google.com/file/d/19VXt-OQp-PkomN_8KDacIgDxa_mA43mV/view?usp=sharing',   // Versembrant M1 · Tema 4.2 Èpoques i estils
  'versembrant-4-1': 'https://drive.google.com/file/d/1__KSHLJzA0-SOJnQFYeHcgfnYZAF0j7s/view?usp=sharing',   // Versembrant M1 · Tema 4.1 Evolució
  'timeline-targetes': 'https://drive.google.com/file/d/1_uQp3xTZzYLUlmMjCbeixlwSb-ttrL-P/view?usp=sharing', // L'Auditori · Targetes Timeline (pp. 71–74)
  'fitxes-experts': 'https://drive.google.com/drive/folders/128UcwvKBteEmnoRFhvYe8krXd8d8Vxl3?usp=sharing',   // Carpeta de fotocòpies · Fitxes dels grups d'experts
  'timeline-solucionari': 'https://drive.google.com/file/d/1i0Z28UlZ5Tz4Lb-EkIoOqCELSoBam3rc/view?usp=sharing'  // L'Auditori · Solucionari del Timeline (p. 27)
};

const SESSIONS = [
  {id:'s1', tag:'S1', title:'Per què neix el hip-hop al Bronx?', items:[
    {main:true, kind:'Fitxa', t:'Ain’t got no… I got!', d:'Fitxa d’audició de Nina Simone amb banc de paraules en anglès.', page:'no-tinc-tinc.html'},
    {main:true, kind:'Presentació', t:'Problema o resposta?', d:'Sis cites del Bronx dels anys 70. Responem amb el cos.', page:'problema-resposta.html'},
    {main:true, kind:'Presentació', t:'Vertader o fals', d:'Sis afirmacions: qui encerta, avança.', page:'problema-resposta.html#vf'},
    {main:true, kind:'Joc', t:'Timeline inicial', d:'12 targetes. Guarda el teu resultat: el compararem a la S5.', page:'timeline-hiphop-12.html'},
    {kind:'Àudio', t:'«Ain’t Got No, I Got Life», Nina Simone', url:'https://youtu.be/L5jI9I03q8E'},
    {kind:'Vídeo', t:'Kool Herc i el breakbeat', url:'https://www.youtube.com/watch?v=btXVvpwgHcQ'},
    {kind:'Web', t:'Cindy Campbell, la festa del 1973', url:'https://rapealo.com/cindy/'}
  ]},
  {id:'s2', tag:'S2', title:'Els cinc elements: grups d’experts', items:[
    {main:true, kind:'Aplicatiu', t:'Grups d’experts · Els cinc elements', d:'Llegeix el teu element, respon les preguntes i prepara el guió.', page:'experts.html'},
    {kind:'Vídeo', t:'Final de breaking, París 2024 · B-boys', url:'https://youtu.be/d-Vo866_jhY'},
    {kind:'Vídeo', t:'Final de breaking, París 2024 · B-girls', url:'https://youtu.be/ld5ygnvN99k'},
    {kind:'Àudio', t:'«Apache», Incredible Bongo Band', d:'cerca a YouTube', url:'https://www.youtube.com/results?search_query=Incredible+Bongo+Band+Apache'}
  ]},
  {id:'s3', tag:'S3', title:'Els cinc elements: tornada al grup base', items:[
    {main:true, kind:'Aplicatiu', t:'Repassa el teu element', d:'Obre el teu guió (pestanya 5) i explica’l en 1 minut amb el gest del grup.', page:'experts.html'}
  ]},
  {id:'s4', tag:'S4', title:'De la baralla a la batalla', items:[
    {main:true, kind:'Aplicatiu', t:'De la baralla a la batalla', d:'«I have a dream», la Zulu Nation i els acords de lliga de Beat Fighters.', page:'s4-batalla.html'},
    {kind:'Vídeo', t:'«I have a dream», Martin Luther King', url:'https://www.youtube.com/watch?v=9ppTiyxFSs0'},
    {kind:'PDF', t:'Text del discurs en castellà', url:'https://igualdadynodiscriminacion.igualdad.gob.es/wp-content/uploads/2024/05/Martin_Luther_King_Tengo_un_sueno.pdf'}
  ]},
  {id:'s5', tag:'S5', title:'El hip-hop aquí i què he après', items:[
    {main:true, kind:'Joc', t:'Timeline final', d:'Les mateixes 12 targetes de la S1. Has millorat?', page:'timeline-hiphop-12.html'},
    {kind:'Vídeo', t:'«Amor al barri», Adala ft. Tribade', url:'https://www.youtube.com/watch?v=0xWvjShuj1w'},
    {kind:'Playlist', t:'Rap en català', url:'https://www.youtube.com/playlist?list=PLTcCgaZxTaEGlZ_3PheVremqaNcy4labT'},
    {kind:'Vídeo', t:'Pupil·les', url:'https://www.youtube.com/watch?v=dMMjY83G1sQ'},
    {kind:'Vídeo', t:'At Versaris', url:'https://www.youtube.com/watch?v=WAyaTWbrNS0'}
  ]},
  {id:'tota', tag:'Voluntari', title:'Per anar més enllà', items:[
    {main:true, kind:'Guia', t:'Fes el teu fanzine', d:'Voluntari. Com plegar-lo, què hi va a cada pàgina i el pòster secret. Lliurament: setmana del 30/11.', page:'fanzine.html'},
    {main:true, kind:'Joc', t:'Timeline · Mitjà i Extrem', d:'25 i 35 targetes, per a qui vulgui un repte més gran.', page:'timeline-hiphop-25.html'},
    {kind:'Vídeo', t:'The Evolution of Hip-Hop (1979–2017)', url:'https://www.youtube.com/watch?v=PrqDFDEJMmU'}
  ]}
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cache = {};
function exists(file){
  const f = file.split('#')[0];
  if(!(f in cache)){
    cache[f] = fetch(f, {method:'HEAD', cache:'no-store'}).then(r => r.ok).catch(() => true);
  }
  return cache[f];
}
function hrefOf(it){
  if(it.page) return it.page;
  if(it.drive) return DRIVE[it.drive] || '';
  return it.url || '';
}
function render(it, ok){
  const href = ok ? hrefOf(it) : '';
  const ext = href && !it.page ? ' target="_blank" rel="noopener"' : '';
  const flag = it.flag ? ` <span class="flag">⚠ ${esc(it.flag)}</span>` : '';
  const pend = it.page ? 'Pròximament' : 'Pendent d’enllaçar';
  if(it.main){
    const inner = `<span><span class="t">${esc(it.t)}</span><br><span class="d">${esc(it.d||'')}</span></span><span class="go">${href ? 'Obre →' : pend}</span>`;
    return href ? `<li><a class="main" href="${esc(href)}"${ext}>${inner}</a></li>`
                : `<li><div class="main soon">${inner}</div></li>`;
  }
  const inner = `<span class="kind">${esc(it.kind)}</span><span><span class="rt">${esc(it.t)}</span>${it.d ? ` <span class="rd">· ${esc(it.d)}</span>` : ''}${flag}</span><span class="go">${href ? '→' : pend}</span>`;
  return href ? `<li><a class="row" href="${esc(href)}"${ext}>${inner}</a></li>`
              : `<li><div class="row soon">${inner}</div></li>`;
}
async function build(){
  const nav = document.getElementById('nav'), content = document.getElementById('content');
  nav.innerHTML = SESSIONS.map(s => `<a href="#${s.id}">${esc(s.tag)}</a>`).join('');
  const all = SESSIONS.flatMap(s => s.items);
  const checks = await Promise.all(all.map(it => it.page ? exists(it.page) : Promise.resolve(true)));
  let k = 0;
  content.style.display = 'flex'; content.style.flexDirection = 'column'; content.style.gap = '36px';
  content.innerHTML = SESSIONS.map(s => {
    const mains = [], rows = [];
    s.items.forEach(it => { (it.main ? mains : rows).push(render(it, checks[k++])); });
    return `<section id="${s.id}"><h2><span class="n">${esc(s.tag)}</span>${esc(s.title)}</h2>`
      + (mains.length ? `<ul>${mains.join('')}</ul>` : '')
      + (rows.length ? `<ul class="rows">${rows.join('')}</ul>` : '')
      + `</section>`;
  }).join('');
}
build();
</script>
</body>
</html>
