<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Problema o resposta?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600&family=Permanent+Marker&display=swap">
<style>
/* Layout: pantalla de projecció en tres franges — barra superior (activitat i comptador), escenari central amb la cita o l'afirmació, controls a sota. Mateixa família visual que la guia del fanzine: tinta negra, paper blanc, retolador groc. */
:root{
  --bg:#ffffff; --ink:#141414; --soft:#5d5d58; --paper:#f3f3ef;
  --mark:#ffd60a; --on-mark:#141414; --no:#141414; --on-no:#ffffff;
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --hand:"Permanent Marker","Comic Sans MS",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--ink:#f1f1ec;--soft:#b3b3ab;--paper:#1d1d1a;--mark:#ffd60a;--on-mark:#141414;--no:#f1f1ec;--on-no:#121211;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121211;--ink:#f1f1ec;--soft:#b3b3ab;--paper:#1d1d1a;--mark:#ffd60a;--on-mark:#141414;--no:#f1f1ec;--on-no:#121211;color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:1400px;margin:0 auto}

.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px;border-bottom:3px solid var(--ink);flex-wrap:wrap}
.bar .act{font-family:var(--display);font-size:clamp(1rem,1.8vw,1.4rem);letter-spacing:.01em}
.bar .act span{background:var(--mark);color:var(--on-mark);padding:0 .25em}
.bar .count{font-variant-numeric:tabular-nums;font-weight:600;color:var(--soft);font-size:clamp(.85rem,1.4vw,1.1rem)}

.stage{display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,2.5vh,28px);padding-block:clamp(14px,3vh,36px);min-height:0;overflow:auto}
.eyebrow{font-size:clamp(.8rem,1.3vw,1.05rem);letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--soft);margin:0}
h1{font-family:var(--display);font-size:clamp(2.4rem,7vw,6rem);line-height:.95;margin:0;text-wrap:balance}
h1 em{font-style:normal;background:var(--mark);color:var(--on-mark);padding:0 .1em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.lead{font-size:clamp(1.05rem,2.2vw,1.8rem);max-width:40ch;margin:0;line-height:1.35}
.hand{font-family:var(--hand);font-size:clamp(1.1rem,2.4vw,2rem);line-height:1.25;margin:0}

blockquote{margin:0;font-family:var(--display);font-size:clamp(1.6rem,4.2vw,3.8rem);line-height:1.12;text-wrap:balance;max-width:24ch}
blockquote.long{font-size:clamp(1.4rem,3.4vw,3rem);max-width:28ch}
.who{font-family:var(--hand);font-size:clamp(1.2rem,2.6vw,2.2rem);margin:0}

.gestures{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,3vw,40px)}
.g{border:3px solid var(--ink);display:grid;grid-template-columns:auto 1fr;align-items:center;gap:clamp(10px,2vw,24px);padding:clamp(10px,2vw,24px);min-width:0}
.g svg{width:clamp(70px,11vw,160px);height:auto;display:block}
.g .lab{font-family:var(--display);font-size:clamp(1.3rem,3.2vw,2.8rem);line-height:1}
.g .name{font-weight:600;font-size:clamp(.9rem,1.6vw,1.3rem);margin-top:6px}
.g .how{font-size:clamp(.85rem,1.4vw,1.15rem);color:var(--soft);margin-top:4px}
.g.yes{background:var(--mark);color:var(--on-mark);border-color:var(--on-mark)}
.g.yes .how{color:var(--on-mark);opacity:.8}
.g.no{background:var(--no);color:var(--on-no);border-color:var(--no)}
.g.no .how{color:var(--on-no);opacity:.8}
.fig{fill:none;stroke:currentColor;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}

.legend{display:flex;gap:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);padding:4px 10px;font-weight:600;font-size:clamp(.8rem,1.3vw,1.05rem)}
.chip svg{width:26px;height:auto}

.answer{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:clamp(12px,2vw,24px);padding:clamp(12px,2vw,22px);border:3px solid var(--ink)}
.answer svg{width:clamp(60px,8vw,110px);height:auto}
.answer .verdict{font-family:var(--display);font-size:clamp(1.6rem,4vw,3.4rem);line-height:1}
.answer .why{font-size:clamp(1rem,1.9vw,1.6rem);margin-top:6px;max-width:48ch}
.answer.yes{background:var(--mark);color:var(--on-mark);border-color:var(--on-mark)}
.answer.no{background:var(--no);color:var(--on-no);border-color:var(--no)}
.ask{font-family:var(--hand);font-size:clamp(1rem,2vw,1.6rem);margin:0}

.timer{height:14px;border:2px solid var(--ink);position:relative;overflow:hidden}
.timer i{position:absolute;inset:0;background:var(--ink);transform-origin:left center;transform:scaleX(1)}
.tnum{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:clamp(1.2rem,2.4vw,2rem)}
.trow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}

.controls{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--ink);flex-wrap:wrap}
.controls .grp{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;font-size:clamp(.9rem,1.4vw,1.1rem);background:var(--bg);color:var(--ink);border:2px solid var(--ink);padding:8px 16px;cursor:pointer}
button.primary{background:var(--ink);color:var(--bg)}
button:hover{background:var(--paper)}
button.primary:hover{background:var(--ink);opacity:.88}
button:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
button[disabled]{opacity:.35;cursor:default}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots b{width:10px;height:10px;border:2px solid var(--ink);display:block}
.dots b.on{background:var(--ink)}
.keys{font-size:.8rem;color:var(--soft)}

@media (max-width:640px){.gestures{grid-template-columns:1fr}.keys{display:none}}
@media (prefers-reduced-motion:reduce){.timer i{transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="stance" viewBox="0 0 120 160">
      <circle class="fig" cx="60" cy="24" r="14"/>
      <path class="fig" d="M60 38 V 96"/>
      <path class="fig" d="M60 96 L 36 150 M60 96 L 84 150"/>
      <path class="fig" d="M38 54 L 82 72 M82 54 L 38 72"/>
      <path class="fig" d="M44 12 H 76" style="stroke-width:5"/>
    </symbol>
    <symbol id="roof" viewBox="0 0 120 160">
      <circle class="fig" cx="60" cy="58" r="14"/>
      <path class="fig" d="M60 72 V 120"/>
      <path class="fig" d="M60 120 L 40 156 M60 120 L 80 156"/>
      <path class="fig" d="M60 82 L 34 66 L 26 24 M60 82 L 86 66 L 94 24"/>
      <path class="fig" d="M14 22 H 38 M82 22 H 106"/>
      <path class="fig" d="M20 10 Q 26 4 32 10 M88 10 Q 94 4 100 10" style="stroke-width:4"/>
    </symbol>
  </defs>
</svg>

<div class="app">
  <header class="bar">
    <div class="act" id="act">S1 · <span>Problema o resposta?</span></div>
    <div class="count" id="count"></div>
  </header>
  <main class="stage" id="stage" aria-live="polite"></main>
  <footer class="controls">
    <div class="grp">
      <button id="prev" type="button" aria-label="Diapositiva anterior">← Enrere</button>
      <button id="next" type="button" class="primary" aria-label="Diapositiva següent">Endavant →</button>
    </div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="grp">
      <button id="timerBtn" type="button">30 s</button>
      <button id="reveal" type="button">Mostra la resposta</button>
    </div>
    <div class="keys">← → canvia · Espai revela · T temporitzador</div>
  </footer>
</div>

<script>
const GEST = {
  yes:{sym:'roof', name:'Raise the roof', how:'Mans amunt, palmells cap al sostre, i empeny'},
  no:{sym:'stance', name:'B-boy stance', how:'Braços creuats al pit, peus oberts, mirada seriosa'}
};
const fig = (s)=>`<svg viewBox="0 0 120 160" aria-hidden="true"><use href="#${s}"/></svg>`;

const slides = [
  {type:'title', act:'Problema o resposta?'},
  {type:'gestures', act:'Problema o resposta?', yes:'RESPOSTA', no:'PROBLEMA',
   title:'Respon amb el cos', text:'Llegim cada cita. Teniu 30 segons per decidir en grup: descriu un problema del Bronx o la resposta del hip-hop?'},
  {type:'quote', act:'Problema o resposta?', q:'La idea sempre va ser desplaçar els que es consideraven més indesitjables.', who:'Jill Jones', ans:'no', why:'Parla de com es va treure la gent humil del barri amb les obres i els desallotjaments.'},
  {type:'quote', act:'Problema o resposta?', q:'El South Bronx era una necròpolis, una ciutat de la mort.', who:'Dr. Wise', ans:'no', why:'Descriu el barri destruït: edificis cremats, abandonats i sense serveis.'},
  {type:'quote', act:'Problema o resposta?', q:"El hip-hop va més enllà dels estereotips i de l'odi que aquests provoquen en les persones. Existeix per representar-les a totes, connecta totes les nacionalitats del món sencer.", who:'Kool Herc', ans:'yes', why:"El hip-hop uneix persones de tots els orígens en lloc de separar-les.", long:true},
  {type:'quote', act:'Problema o resposta?', q:"La gent jove és conscient que així no existeix sortida possible, i quan no hi ha sortida, no importa si un/a és violent/a.", who:'Amalia Betanzos', ans:'no', why:"Joves sense feina ni futur: la violència apareix quan no hi ha sortida.", long:true},
  {type:'quote', act:'Problema o resposta?', q:'El hip-hop tracta de la victòria als carrers. El que veus a la TV és mentida.', who:'KRS-One', ans:'yes', why:"Guanyar al carrer amb art i amb la teva veu, no amb els punys."},
  {type:'quote', act:'Problema o resposta?', q:"No hi ha cap genet solitari en el hip-hop. Compartim el mateix sentiment de marcar la diferència en el món i fer-ne un lloc millor on viure.", who:'Thabang Tefo', ans:'yes', why:"El hip-hop és col·lectiu: la crew treballa junta per millorar el seu entorn.", long:true},
  {type:'gestures', act:'Vertader o fals', yes:'VERTADER', no:'FALS',
   title:'Tancament: vertader o fals', text:'Tothom comença a l\'aro 0. Fes el gest; si encertes, avança un aro. Sis afirmacions: fins on arribaràs?', anchor:'vf'},
  {type:'vf', act:'Vertader o fals', n:1, q:'El hip-hop neix a Manhattan.', ans:'no', why:'Neix al South Bronx, el barri on es van haver de traslladar moltes famílies expulsades de Manhattan.'},
  {type:'vf', act:'Vertader o fals', n:2, q:'Una autopista va obligar moltes famílies a deixar el barri.', ans:'yes', why:"La Cross Bronx Expressway va fer enderrocar molts edificis on vivien famílies treballadores."},
  {type:'vf', act:'Vertader o fals', n:3, q:'Als anys 70, al South Bronx hi havia molt poc atur juvenil.', ans:'no', why:"Entre un 60% i un 80% dels joves no tenien feina."},
  {type:'vf', act:'Vertader o fals', n:4, q:'Cindy Campbell va organitzar la festa del 1973.', ans:'yes', why:"L'11 d'agost de 1973, al 1520 de Sedgwick Avenue. El seu germà, Kool Herc, punxava i allargava els breaks."},
  {type:'vf', act:'Vertader o fals', n:5, q:'El hip-hop neix per fer més violència.', ans:'no', why:"Neix com a alternativa a la violència: competir amb art en lloc de barallar-se."},
  {type:'vf', act:'Vertader o fals', n:6, q:'El hip-hop va néixer a les festes de barri (block parties).', ans:'yes', why:"Les block parties reunien el veïnat al carrer o als edificis: DJ, MC, ball i grafiti en una sola festa."},
  {type:'bridge', act:'Pont amb Beat Fighters'}
];

let i = 0, revealed = false, timerId = null, tLeft = 30;
const $ = (id)=>document.getElementById(id);
const stage = $('stage');

function gestureCard(kind, label){
  const g = GEST[kind];
  return `<div class="g ${kind}">${fig(g.sym)}<div><div class="lab">${label}</div><div class="name">${g.name}</div><div class="how">${g.how}</div></div></div>`;
}
function legend(yesLab, noLab){
  return `<div class="legend"><span class="chip">${fig(GEST.yes.sym)} ${yesLab} = ${GEST.yes.name}</span><span class="chip">${fig(GEST.no.sym)} ${noLab} = ${GEST.no.name}</span></div>`;
}
function answerBlock(s, yesLab, noLab){
  const k = s.ans, g = GEST[k];
  return `<div class="answer ${k}">${fig(g.sym)}<div><div class="verdict">${k==='yes'?yesLab:noLab}</div><div class="why">${s.why}</div></div></div>`;
}
function timerBlock(){
  return `<div class="trow"><div class="timer" aria-hidden="true"><i id="tbar"></i></div><div class="tnum" id="tnum">30</div></div>`;
}

function render(){
  stopTimer();
  const s = slides[i];
  $('act').innerHTML = `S1 · <span>${s.act}</span>`;
  $('count').textContent = `${i+1} / ${slides.length}`;
  const canReveal = s.type==='quote' || s.type==='vf';
  $('reveal').disabled = !canReveal || revealed;
  $('timerBtn').disabled = !canReveal;
  $('prev').disabled = i===0;
  $('next').disabled = i===slides.length-1;
  let h = '';
  if(s.type==='title'){
    h = `<p class="eyebrow">Música · 2n ESO · Arrels del hip-hop</p>
      <h1>Problema<br>o <em>resposta?</em></h1>
      <p class="lead">Al South Bronx dels anys 70 hi havia molts problemes. El hip-hop hi va néixer com una resposta. Escoltarem sis veus d'aquella història.</p>
      <p class="hand">Treballeu en grup · 30 segons per cita · un portaveu justifica</p>`;
  } else if(s.type==='gestures'){
    h = `<p class="eyebrow">${s.anchor?'Activitat de tancament':'Com responem'}</p>
      <h1>${s.title}</h1>
      <p class="lead">${s.text}</p>
      <div class="gestures">${gestureCard('no', s.no)}${gestureCard('yes', s.yes)}</div>`;
  } else if(s.type==='quote'){
    const n = slides.slice(0,i+1).filter(x=>x.type==='quote').length;
    h = `<p class="eyebrow">Cita ${n} de 6</p>
      <blockquote class="${s.long?'long':''}">«${s.q}»</blockquote>
      <p class="who">${s.who}</p>
      ${revealed ? answerBlock(s,'RESPOSTA','PROBLEMA') + `<p class="ask">Portaveu: per què ho heu decidit així?</p>` : timerBlock() + legend('RESPOSTA','PROBLEMA')}`;
  } else if(s.type==='vf'){
    h = `<p class="eyebrow">Afirmació ${s.n} de 6</p>
      <blockquote>${s.q}</blockquote>
      ${revealed ? answerBlock(s,'VERTADER','FALS') + `<p class="ask">Qui ha encertat, avança un aro!</p>` : timerBlock() + legend('VERTADER','FALS')}`;
  } else {
    h = `<p class="eyebrow">Per a la propera sessió</p>
      <h1>Per què una <em>batalla</em> pot substituir una <em>baralla?</em></h1>
      <p class="lead">Penseu-hi. A la sessió 2 descobrirem com les crews del Bronx van canviar els punys per la música, el ball i el grafiti.</p>
      <div class="gestures">${gestureCard('no','BARALLA')}${gestureCard('yes','BATALLA')}</div>`;
  }
  stage.innerHTML = h;
  const dots = $('dots'); dots.innerHTML = slides.map((_,k)=>`<b class="${k===i?'on':''}"></b>`).join('');
}

function go(d){
  const n = i + d;
  if(n<0 || n>=slides.length) return;
  i = n; revealed = false; render();
}
function reveal(){
  const s = slides[i];
  if(!(s.type==='quote'||s.type==='vf') || revealed) return;
  revealed = true; render();
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function startTimer(){
  const s = slides[i];
  if(!(s.type==='quote'||s.type==='vf') || revealed) return;
  stopTimer(); tLeft = 30;
  const bar = $('tbar'), num = $('tnum');
  if(!bar) return;
  bar.style.transition='none'; bar.style.transform='scaleX(1)';
  num.textContent = tLeft;
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ bar.style.transition='transform 30s linear'; bar.style.transform='scaleX(0)'; }); });
  timerId = setInterval(()=>{
    tLeft--; if(num) num.textContent = Math.max(tLeft,0);
    if(tLeft<=0){ stopTimer(); if(num) num.textContent='Temps!'; }
  },1000);
}

$('prev').addEventListener('click',()=>go(-1));
$('next').addEventListener('click',()=>go(1));
$('reveal').addEventListener('click',reveal);
$('timerBtn').addEventListener('click',startTimer);
document.addEventListener('keydown',(e)=>{
  if(e.target && e.target.tagName==='BUTTON' && (e.key===' '||e.key==='Enter')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); go(1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(-1); }
  else if(e.key===' '||e.key==='Enter'){ e.preventDefault(); reveal(); }
  else if(e.key==='t'||e.key==='T'){ startTimer(); }
});

if(location.hash==='#vf'){ const k = slides.findIndex(s=>s.anchor==='vf'); if(k>=0) i=k; }
render();
</script>
</body>
</html>
